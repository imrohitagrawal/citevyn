# Uptime + index-health probe for the public demo.
#
# WHY THIS AND NOT UPTIMEROBOT:
#   * no third-party signup, and the check lives in the repo where it is
#     reviewed and versioned like anything else;
#   * free — Actions minutes are unmetered on public repositories;
#   * and it can assert SEMANTIC health, which a generic HTTP monitor cannot.
#     A 200 from /health only proves the process is alive. The failure that
#     actually ruins this demo is a live process serving a dead index — every
#     answer silently degrades to lexical matching — so this probe also checks
#     /health/index and fails on `vector_arm.status == "dead"`.
#
# WHY EVERY 30 MINUTES AND NOT EVERY 5:
#   The machine is scale-to-zero, and fly.toml is explicit that this "is what
#   makes the demo free". Every probe WAKES it, and it then idles for a few
#   minutes before stopping again. A 5-minute probe would keep it running
#   essentially 24/7 and turn a ~$0-2/mo deployment into a ~$3-4/mo one — the
#   monitor would cost more than the thing it monitors. At 30 minutes the
#   machine wakes ~48x/day instead of ~288x, an outage is caught within half an
#   hour, and the cost design survives. Tighten the cron only if you decide
#   faster detection is worth the running time.
#
#   GitHub's scheduled runs are best-effort and can be delayed under load, so
#   treat this as "notices an outage", not "pages you in 30 minutes".
#
# ALERTING: a failed scheduled workflow emails the repository owner. There is
# nothing to configure, and no secret is needed — both probed endpoints are
# deliberately unauthenticated.

name: uptime

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: # so it can be run on demand after a deploy

permissions:
  contents: read

concurrency:
  # A delayed run must never pile up behind the next scheduled one.
  group: uptime
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: https://citevyn.stackclimb.com
    steps:
      - name: Liveness — GET /health
        run: |
          set -euo pipefail
          # --max-time 45, not the default: the FIRST request after an idle
          # period pays a cold boot (measured ~7s, and the machine has to be
          # started by Fly's proxy first). A short timeout here would report an
          # outage that is really just scale-to-zero working as designed.
          code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 45 --retry 2 --retry-delay 5 "$BASE_URL/health")
          echo "GET /health -> $code"
          cat /tmp/health.json
          test "$code" = "200"

      - name: Index health — GET /health/index (vector arm must be live)
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/index.json -w '%{http_code}' --max-time 45 "$BASE_URL/health/index")
          echo "GET /health/index -> $code"
          python3 - <<'PY'
          import json, sys
          from datetime import datetime

          with open("/tmp/index.json") as fh:
              body = json.load(fh)

          status = body.get("status")
          arm = body.get("vector_arm") or {}
          arm_status = arm.get("status")
          ratio = arm.get("embedded_ratio")
          match = arm.get("embedder_match")

          # !r throughout: a value printed raw that starts a line with "::" is a
          # workflow command in this log.
          print(f"status={status!r} vector_arm={arm_status!r} embedded_ratio={ratio!r} embedder_match={match!r}")

          problems = []
          if status != "ready":
              problems.append(f"index status is {status!r}, expected 'ready'")
          if arm_status == "dead":
              # The corpus was built with the stub embedder (all-NULL vectors) or
              # the embeddings were lost. The API still answers 200 the whole
              # time, which is exactly why this is worth asserting.
              problems.append("vector_arm is DEAD — semantic search is off")
          if arm_status == "ambiguous":
              # More than one row is marked `active` (#58/#264). The read path
              # fails closed on that, so the vector arm is OFF. Named explicitly
              # rather than left to the `embedder_match` check below: that check
              # DOES fire here (the route reports the read path's own fail-closed
              # verdict), but it would report "the embedders disagree", which is
              # not what happened and would send the operator to ADR-0003 instead
              # of to `promote_version`.
              count = arm.get("active_index_count")
              problems.append(
                  f"vector_arm is AMBIGUOUS — {count!r} index versions are marked "
                  "active; promote a version that is NOT currently active "
                  "(?force=true if it has no passing eval run) to converge"
              )
          if match is False and arm_status != "ambiguous":
              # The configured query embedder no longer matches the one that
              # built the index: retrieval compares vectors from two different
              # spaces. See docs/ADR/0003.
              #
              # Suppressed under `ambiguous`: there NOTHING WAS COMPARED. The
              # route feeds the shared predicate the ambiguous sentinel rather
              # than a stamp, and that returns True unconditionally, so
              # `embedder_match` is False whatever the real identities are — it
              # carries no mismatch signal at all in that state. Left in, the
              # alert would pair a true diagnosis with a meaningless one and send
              # the operator to ADR-0003 instead of to promote_version.
              problems.append("embedder_match is False — query/index embedders disagree")

          # The query embedder (the provider that turns each question into a
          # search vector) refusing this account: an empty prepaid balance or a
          # bad key. Search then silently drops to keyword-only while every
          # answer still returns 200, so nothing else here notices. Decided on
          # the known-good value (#460): only "ok" passes. "unconfigured" (no
          # Redis set) and "unavailable" (Redis unreadable) page too: production
          # always sets Redis, and without it this check is switched off. A body
          # without the block (a build from before it, or a rollback to one)
          # pages for the same reason. Which status it was is in the app's log.
          embedder = body.get("query_embedder")
          if not isinstance(embedder, dict):
              problems.append(
                  "query_embedder block is missing: this build predates the "
                  "query-embedder check (rolled back?), so a refused embedding "
                  "provider would go unnoticed"
              )
          else:
              state = embedder.get("state")
              print(f"query_embedder={state!r}")
              if state == "refused":
                  since = embedder.get("refused_since")
                  # Printed into this log, where a line starting "::" is a
                  # workflow command: only a timestamp that reads back
                  # unchanged is passed through (fromisoformat alone accepts
                  # any separator, a newline included).
                  try:
                      ok = datetime.fromisoformat(since).isoformat() == since
                  except (TypeError, ValueError):
                      ok = False
                  if not ok:
                      since = "<invalid>"
                  reason = (
                      f"query embedder: the provider has refused this account since {since}. "
                      "Search is keyword-only. Most often the provider account's prepaid "
                      "credit is used up (add credit in its billing console); otherwise the "
                      "embedding key is wrong or revoked. After fixing, it clears by itself "
                      "within one self-check interval (3 h by default) plus a probe cycle; "
                      "asking the site one NEW question clears it sooner (a repeated one is "
                      "answered from cache). docs/RUNBOOK.md §3.4a"
                  )
                  print(f"::error title=Query embedder refused::{reason}")
                  problems.append(reason)
              elif state == "unconfigured":
                  problems.append(
                      "query embedder: no Redis is configured, so refusals are not tracked "
                      "(set CITEVYN_REDIS_URL)"
                  )
              elif state == "unavailable":
                  problems.append(
                      "query embedder: the app could not read Redis in time, so refusals "
                      "are not tracked (check Redis; the rate limiter depends on it too)"
                  )
              elif state != "ok":
                  problems.append(f"query embedder: unrecognised state {state!r}")

          if problems:
              print("FAIL: " + "; ".join(problems), file=sys.stderr)
              sys.exit(1)
          print("OK: index is ready and the vector arm is healthy")
          PY

  # GitHub disables a public repository's scheduled workflows after 60 days
  # with no repository activity, and then this probe (and every alert above)
  # stops without a word. On every scheduled run this job re-enables the
  # workflow through the API, which is harmless while it is enabled.
  # UNVERIFIED: whether that call also resets the 60-day timer; if it does not,
  # a disabled probe still needs re-enabling by hand (docs/RUNBOOK.md §3.4a).
  # Its own job, so only it holds actions: write; the probe keeps contents: read.
  keep-enabled:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api --method PUT "repos/${{ github.repository }}/actions/workflows/uptime.yml/enable"; then
            # Fails this run (so it is seen), but says plainly the site is not down.
            echo "::error title=keep-enabled failed (the site is fine)::Could not re-enable the uptime workflow through the API; the probe job above is the site check."
            exit 1
          fi
          echo "re-enabled"
