name: PR Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  security-events: write
  pull-requests: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality-gate:
    if: github.event.pull_request.draft == false
    uses: imrohitagrawal/.github/.github/workflows/reusable-pr-quality.yml@464b794fb62a6aa364fc6aaf47b19e52c13a2683 # imrohitagrawal/.github #29 (after v8)
    with:
      python-directory: backend
      node-directory: frontend