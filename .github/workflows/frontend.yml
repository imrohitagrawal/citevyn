name: frontend

# The corpus paths are here on purpose: ``knowledgeBase.corpus.test.ts`` asserts
# the offline KB does not tell a user to paste a command the shipped corpus no
# longer contains (#178). That guard is only useful if editing the corpus RUNS
# it, so a change under ``backend/app/worker/sources/`` triggers this workflow
# even though it touches no frontend file.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/app/worker/sources/**'
      - 'frontend.yml'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/app/worker/sources/**'
      - '.github/workflows/frontend.yml'

permissions:
  contents: read

jobs:
  build:
    name: type-check + unit tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Single source of truth: frontend/.nvmrc. Do NOT add a `node-version:`
          # key alongside this — setup-node gives `node-version` precedence, which
          # would make the file decorative and re-open #231.
          node-version-file: frontend/.nvmrc
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Type-check
        run: npm run type-check
      # The vitest suite existed but nothing ran it in CI, so every frontend unit
      # test — including the corpus drift guard added in #178 — was decorative.
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      # The eager-chunk gzip ceiling used to be prose in a docs/BACKLOG.md row —
      # raised and recorded by the same person, with nothing checking it in either
      # direction. It moved twice in two PRs before anyone noticed. The number now
      # lives in frontend/bundle-budget.json where a diff can see it, and this step
      # is what makes it real. The script rebuilds the SHIPPING variant itself
      # (VITE_API_LIVE=true, matching the Dockerfile) because a build without that
      # flag is ~860 B larger and is not what ships.
      - name: Bundle budget
        run: npm run check:bundle
      - name: Upload dist artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
