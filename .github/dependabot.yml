# Dependabot keeps the dependency graph current. Five ecosystems
# are tracked: Python (uv), npm, Docker base images, Docker Compose
# service images, and GitHub Actions.
#
# Cadence is weekly for Python and Docker, monthly for npm and
# Actions — Actions pins churn less often and we'd rather not have
# noisy PRs on every release; npm's cadence is argued at its own
# block below.
#
# An ecosystem that is NOT listed here gets no version updates at
# all. Security updates ignore this file entirely and open PRs
# regardless, which is why a missing entry looks like "nothing to
# update" rather than like a misconfiguration. ``npm`` was absent
# until #423: ``frontend/`` had received only security PRs since
# the repo began, and ``@types/node`` sat at ``^20.16.0`` while
# ``frontend/.nvmrc`` had moved to ``26`` — six major numbers, three
# even-numbered Node LTS generations — with nothing watching (#413).
# (#423, and the first draft of this very comment, both said "two
# majors". That was inherited and never checked. ``git log -p --
# frontend/package.json`` shows one edit, ``^20.16.0`` -> ``^26.5.1``,
# and settles it.) The tell was in
# the PR titles — every backend/docker/CI Dependabot PR carries the
# custom prefixes configured below (``deps(deps):``,
# ``deps(dev)(deps-dev):``, ``deps(ci)(deps):``,
# ``deps(docker)(deps):``) while every ``/frontend`` one carried
# Dependabot's defaults (``chore(...)``, ``build(...)``), proving
# they had never passed through this file.
#
# ``backend/tests/test_dependabot_config.py`` asserts the PARSED
# structure of this file, not its text: a syntactically valid file
# that lost an entry still fails there. A malformed
# ``dependabot.yml`` is silently ignored by GitHub, so without that
# guard the failure mode is an absence of PRs, which is
# indistinguishable from having no updates available.
#
# Declared-but-INEFFECTIVE is the same outcome reached another way,
# so that guard also rejects the keys that produce it silently —
# ``ignore``, ``allow``, ``cooldown``, ``versioning-strategy``, a
# group ``exclude-patterns`` or ``dependency-type``, and
# ``open-pull-requests-limit: 0`` (which GitHub documents as the way
# to switch an ecosystem off). None of them is banned on principle;
# each is banned from arriving without a reviewer noticing, and the
# way to use one deliberately is to take it out of that file's ban
# list in the same commit. The guard also rejects an UNKNOWN key at
# entry and group level, because a typo'd one is the cheapest way to
# invalidate this file. What it cannot see is written down in the
# test file's own ``_UNGUARDABLE`` register.
#
# GitHub itself validates this file on any PR that touches it: a
# check run named ``.github/dependabot.yml`` from the ``dependabot``
# app, "Dependabot config file validation". It is not a required
# context, so read it rather than relying on the rollup.
#
# LABELS (#436). Every name under a ``labels:`` key below is one
# ``gh label list`` really returns. The mechanism, from GitHub's
# options reference, is narrower than "Dependabot cannot create a
# label" -- an earlier draft of this comment said that and it is
# FALSE. Two rules, both quoted from that page:
#   1. "The labels specified are used INSTEAD of the default
#      labels." Declaring ``labels:`` REPLACES the set Dependabot
#      would otherwise apply -- ``dependencies`` plus an ecosystem
#      or language label, which it "creates automatically, as
#      necessary in your repository". That is where this repo's
#      ``dependencies``, ``javascript`` and ``github_actions``
#      labels came from: their descriptions are Dependabot's stock
#      text, which nobody hand-types.
#   2. "If any of these labels is not defined in the repository, it
#      is IGNORED." A name inside ``labels:`` is never created.
# Rule 1 is proven in this repo, not merely quoted: PR #10
# (2026-06-20T15:39:48Z) carried ``dependencies`` AND
# ``github_actions`` under commit ``ccf28b5``, three hours older,
# whose github-actions entry had NO ``labels:`` key at all. Nobody
# created those two by hand.
# Rule 2 is the #436 defect: ``python`` (uv), ``docker`` (both
# docker entries) and ``ci`` (github-actions) were requested here
# and never landed. PRs #433 and #434 (uv), #227 (docker) and #243
# (github-actions) each carry ``dependencies`` and nothing else.
# The positive control is #438, #439 and #440 -- the first npm PRs
# opened AFTER #435 added an npm entry asking for ``javascript``
# (config merged 08:17Z, those PRs opened 08:19Z) -- which carry
# both. NOT #307: it predates that entry by twelve days, so its
# ``javascript`` came from rule 1's default path, and its
# ``chore(deps-dev):`` title is this file's own evidence that it
# never passed through here at all.
# Deleting ``python`` and ``docker`` therefore changes NOTHING
# about what Dependabot applies -- they were already ignored -- and
# ``ci`` -> ``github_actions`` makes an inert request start
# landing. Worth knowing before anyone proposes creating
# ``python`` by hand: the default path would not apply it either,
# because dependabot-core registers uv's language label as
# ``python:uv`` (``uv/lib/dependabot/uv.rb``).
# The deliberate tradeoff, written down because rule 1 makes it
# invisible otherwise: keeping ``labels: ["dependencies"]`` on the
# uv and docker entries SUPPRESSES the default ecosystem label
# Dependabot would auto-create if the key were absent entirely.
# That is the owner's call for #436 -- no new labels -- and not an
# oversight. Deleting the key is how to revisit it, and the guard
# forbids that today, on purpose.
# Why no label was created by hand either: that is a repository
# SETTING, and only ONE label here is read by automation --
# ``full-eval``, which gates the paid judged eval at
# ``.github/workflows/ci.yml:413``. Grepping every workflow finds
# no other GitHub-label read (``release.yml``'s ``labels:`` are OCI
# image labels, not these). Every other label, ``dependencies``
# included, exists for human filtering only -- whether anyone
# actually filters by it is not measured here and is not claimed.
# ``dependencies`` stays on every entry because it is the one name
# every Dependabot PR in this repo's history already carries.
# One document disagrees with the ``full-eval`` sentence above:
# ``docs/DEPENDABOT_TRIAGE.md`` describes a ``release-blocker``
# label, an ``auto-label.yml`` and a ``nightly.yml``, none of which
# the repo has. It is fiction, filed as #443, and it is not
# evidence against the grep.
# ``test_dependabot_config.py`` holds every label in this file to
# that verified-present snapshot.
#
# Auto-merge policy (since 2026-06-21):
#   Branch protection on ``main`` requires 10 status checks — this
#   line said 5 until #423; ``gh api
#   repos/imrohitagrawal/citevyn/branches/main/protection --jq
#   '.required_status_checks.contexts | length'`` returns 10, with
#   ``strict: true`` (see
#   Settings → Branches → main). To enable auto-merge at the repo
#   level, go to Settings → General → "Allow auto-merge" and
#   enable it, then enable auto-merge on individual Dependabot PRs
#   via the "Enable auto-merge" button in the PR UI. Without
#   branch protection, do NOT enable auto-merge — Dependabot would
#   merge PRs before CI has had a chance to run.
#   * Patch + security updates auto-merge once CI passes.
#   * Minor + major version updates still open PRs for human
#     review. Major bumps can change runtime behavior (e.g.
#     Python 3.12→3.14 in the Docker image) or remove inputs
#     (docker/login-action v4 dropped a few), and should not
#     land without eyes on the diff.
#   * The ``target-branch`` is pinned to ``main`` explicitly even
#     though that's the repo default — makes the intent obvious
#     to future readers and prevents surprises if a non-default
#     branch ever becomes the merge target.

version: 2
updates:
  # ──────────── Python (uv) ────────────
  - package-ecosystem: "uv"
    directory: "/backend"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Los_Angeles"
    # Cap concurrent open Dependabot PRs so the queue stays
    # reviewable. 5 matches the historical max we've seen
    # (uv-runtime, uv-dev, plus 3 standalones).
    open-pull-requests-limit: 5
    # Auto-rebase keeps weekly PRs from rotting when main moves
    # before the weekly cron fires.
    rebase-strategy: "auto"
    # ``deps(uv): bump fastapi to 0.138.0`` reads better in
    # ``git log`` than ``Bump the python-runtime group...``.
    commit-message:
      prefix: "deps"
      prefix-development: "deps(dev)"
      include: scope
    # Group patch + minor updates into a single PR so reviewers
    # see "dependencies: weekly rollup" rather than 12 PRs.
    # Dependabot honors grouping when a group contains more than
    # one package; singletons still open as their own PR.
    groups:
      python-runtime:
        applies-to: version-updates
        patterns:
          - "fastapi"
          - "uvicorn"
          - "pydantic"
          - "pydantic-settings"
          - "sqlalchemy"
          - "alembic"
          - "httpx"
          - "redis"
          - "psycopg"
      python-dev:
        applies-to: version-updates
        patterns:
          - "pytest"
          - "pytest-asyncio"
          - "ruff"
          - "pyright"
          - "fakeredis"
    # ``python`` used to sit here and the repo has never had it, so
    # it was ignored and every uv PR arrived with ``dependencies``
    # alone. Removing it changes nothing about what lands (#436).
    labels:
      - "dependencies"

  # ──────────── Frontend (npm) ────────────
  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "main"
    # MONTHLY, not weekly like the backend. ``main`` is protected
    # with 10 required status checks and ``strict: true``, so
    # merging any one PR makes every other open PR out-of-date and
    # unmergeable until someone runs ``gh pr update-branch`` on it.
    # A batch of npm PRs therefore costs O(n²) rebases, not O(n).
    # Monthly keeps that queue payable while still being infinitely
    # more than the zero scheduled updates ``frontend/`` got before
    # #423. Raise it to weekly only if the backlog is routinely
    # empty when the cron fires.
    schedule:
      interval: "monthly"
      day: "monday"
      time: "08:00"
      timezone: "America/Los_Angeles"
    # 3, below the backend's 5, for the same staleness reason: each
    # open PR is one more that goes stale on every merge.
    #
    # There are FOUR groups below, so a month in which every group has
    # work opens three PRs and holds the fourth — plus any major, which
    # by design arrives standalone — to the next cycle. That is the
    # intended trade: a queue that drains is worth more here than one
    # that arrives complete, because each extra open PR costs a rebase
    # on every merge. Raising this also means editing the assertion in
    # backend/tests/test_dependabot_config.py, which is the friction
    # that makes it a decision rather than a drift.
    open-pull-requests-limit: 3
    rebase-strategy: "auto"
    # Same prefixes as the backend block. This is not cosmetics: the
    # prefix is the only evidence in a PR title that the PR came
    # through this file at all, and that is precisely how #423 was
    # spotted. A ``chore(deps-dev):`` title on a ``/frontend`` PR
    # from here on means a SECURITY update, which bypasses this
    # config — worth knowing at a glance.
    commit-message:
      prefix: "deps"
      prefix-development: "deps(dev)"
      include: scope
    # Minor + patch are batched; ``update-types`` is what makes that
    # true. A group WITHOUT it swallows majors too, and a major is
    # the one bump that needs its own review and its own revert.
    # ``applies-to: version-updates`` leaves security updates
    # ungrouped so an advisory fix is never held behind a routine
    # bump.
    #
    # Every pattern below names a package that is really declared in
    # ``frontend/package.json``; a pattern that matches nothing
    # groups nothing, silently. The guard test asserts the mapping.
    groups:
      frontend-runtime:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "react"
          - "react-dom"
      frontend-build:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "vite"
          - "@vitejs/plugin-react"
          - "typescript"
          - "postcss"
          - "stylelint"
      frontend-test:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "vitest"
          - "@playwright/test"
          - "@testing-library/*"
          - "jsdom"
          - "js-yaml"
      # ``@types/node`` lives here and is the one bump that can go
      # RED on purpose:
      # ``backend/tests/test_node_version_pin.py::test_types_node_major_matches_the_pin``
      # requires its MAJOR to equal ``frontend/.nvmrc``. Minor and
      # patch bumps stay inside the major and pass, which is why
      # they are grouped. A major bump escapes this group (see
      # ``update-types`` above), arrives as its own PR and FAILS the
      # required ``pytest + lint`` check until ``.nvmrc``, the
      # Dockerfiles and the workflows move with it. That is the
      # guard doing its job, not a broken test — the runtime and the
      # types that describe it must move together (#413). Fix the
      # pin, do not weaken the guard.
      frontend-types:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "@types/*"
    # ``javascript`` rather than a made-up ``frontend``: Dependabot
    # cannot create a label that does not exist in the repo, and
    # these two are the ones that do (``gh label list``).
    labels:
      - "dependencies"
      - "javascript"

  # ──────────── Docker base images ────────────
  - package-ecosystem: "docker"
    directory: "/infra/docker"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "08:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 3
    rebase-strategy: "auto"
    commit-message:
      prefix: "deps(docker)"
      include: scope
    # Tracks ``FROM`` lines in ``Dockerfile.api`` and
    # ``Dockerfile.worker`` (e.g. python:3.12-slim-bookworm,
    # ghcr.io/astral-sh/uv:python3.12-bookworm-slim). The
    # ``docker-compose`` ecosystem below separately covers
    # the ``image:`` refs in the compose file.
    # Group ALL base-image bumps into ONE PR (#82): the uv builder
    # (ghcr.io/astral-sh/uv:python3.X) and the slim runtime
    # (python:3.X-slim-bookworm) MUST move in lockstep, or a minor bump
    # drifts the builder/runtime interpreter apart and ships a
    # non-booting image (the exact class #34 fixed). One grouped PR
    # keeps the two ``FROM`` interpreters aligned.
    groups:
      docker-base-images:
        patterns:
          - "*"
    # No ``docker`` label: the repo has never had one (#436).
    labels:
      - "dependencies"

  # ──────────── Compose service images ────────────
  - package-ecosystem: "docker-compose"
    directory: "/infra/docker"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "08:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 3
    rebase-strategy: "auto"
    commit-message:
      prefix: "deps(docker)"
      include: scope
    # Tracks ``image:`` references in
    # ``infra/docker/docker-compose.yml`` (pgvector, redis,
    # caddy, postgres). Without this entry the service
    # images would silently rot.
    # No ``docker`` label here either, same reason (#436).
    labels:
      - "dependencies"

  # ──────────── GitHub Actions ────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "08:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 3
    rebase-strategy: "auto"
    commit-message:
      prefix: "deps(ci)"
      include: scope
    # ``github_actions``, not ``ci``: the underscored one is the
    # label Dependabot itself seeded here (its description is
    # Dependabot's stock "Pull requests that update GitHub Actions
    # code") and the one `gh label list` returns. ``ci`` was
    # requested here and, being undefined, ignored (#436). This is
    # the one entry whose labelling actually CHANGES.
    labels:
      - "dependencies"
      - "github_actions"
