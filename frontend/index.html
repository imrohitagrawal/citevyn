<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Icons live in frontend/public/, which Vite copies verbatim into dist/ and the
      API then serves from its StaticFiles mount. favicon.ico is listed alongside the
      SVG because plenty of clients (Windows, pinned tabs, feed readers) request
      /favicon.ico by convention regardless of what these tags say.
      backend/tests/test_frontend_assets.py asserts every local href below resolves.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffd75e" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#161618" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CiteVyn — a cited RAG assistant for Claude, Claude Code, Codex, and Gemini."
    />
    <meta name="color-scheme" content="light dark" />
    <title>CiteVyn — Cited answers for your AI tools</title>

    <!-- Geist is the typeface `--font-sans` / `--font-display` ask for, so it has
         to actually be delivered: without it the first entry in the stack is
         unavailable and every heading and paragraph silently falls through to
         `system-ui` — SF Pro on macOS, Segoe UI on Windows (#316). It arrives as
         a VARIABLE face, ONE @font-face rule covering 400..700 (the whole range
         the CSS uses — measured; nothing anywhere needs 800). It is 28.6 KB.

         NOT a byte saving over static weights: asking Google for the four static
         weights returned four @font-face blocks whose `src` is the SAME file, so
         a browser fetched 28.6 KB either way. An earlier version of this comment
         claimed 114.4 KB and a "75% saving" — that was the same file counted
         four times by a script that keyed on weight instead of de-duplicating
         URLs. The variable form is still right, for the honest reason: one rule,
         whole range, no weight synthesis.

         CAVEAT worth knowing: `<strong>`/`<b>` default to `font-weight: bolder`,
         which is RELATIVE — inside a 600 or 700 container it resolves to 900, and
         Geist clamps 800/900 to 700, so bold emphasis would render exactly as
         heavy as its parent and visually vanish. Safe today: every prose
         container that produces <strong> (AnswerBody's markdown bold) computes to
         400. Setting a prose container to 600 would break it silently.

         THERE IS DELIBERATELY NO FONT STYLESHEET LINK HERE (#365). Until this
         change the head carried a rel=stylesheet link to a Google Fonts css2
         URL, plus two preconnects. A render-blocking stylesheet also blocks a
         type=module script from EXECUTING, and the whole app is one module
         entry — so while that third-party request was slow the visitor got a
         BLANK page with no spinner, no text and no error, not an unstyled one.
         Measured on this app: fonts normal 191-323 ms to first rendered UI,
         that stylesheet stalled 40 s -> 40 150 ms.

         NOTE FOR THE NEXT EDITOR: keep third-party URLs out of this comment,
         and out of any comment in this file. `test_csp_covers_the_pages_real_
         origins.py` and the emitted-artifact guard in
         `src/test/buildGuards.test.ts` both scan this file for off-origin
         references WITHOUT stripping comments — deliberately, because a parser
         that honours comments can be defeated by a real tag disguised as one.
         Failing on a mention in a comment is the safe direction, but it is
         still a false red for whoever hits it. Say the host in prose instead of
         writing a URL. (This paragraph is the receipt: the first draft of this
         comment quoted the old tag verbatim and turned the origin parser red.)

         The faces are now served from this origin. `src/styles/fonts.css` holds
         the @font-face rules and rides in the app's own stylesheet, which Vite
         already emits and links, so it costs no extra render-blocking request;
         `public/fonts/*.woff2` holds the bytes. Font FILES have never been
         render-blocking, so a visitor whose font requests fail now gets the
         fallback stack and a working app instead of a white screen —
         `tests/fonts-offline.spec.ts` proves that in a real browser.

         The two preloads below are a HINT, not the mechanism: they let the two
         faces start downloading while the stylesheet is still being fetched,
         instead of after it parses. Deleting them costs a round trip and
         nothing else. `backend/tests/test_frontend_assets.py` resolves both
         hrefs against `frontend/public/`, so a renamed or dropped file fails
         there by name. `crossorigin` is REQUIRED even same-origin: font fetches
         are CORS-mode, and a preload without it is a second, unshared fetch. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/geist-latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/jetbrains-mono-latin.woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
