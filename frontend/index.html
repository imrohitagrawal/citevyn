<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Icons live in frontend/public/, which Vite copies verbatim into dist/ and the
      API then serves from its StaticFiles mount. favicon.ico is listed alongside the
      SVG because plenty of clients (Windows, pinned tabs, feed readers) request
      /favicon.ico by convention regardless of what these tags say.
      backend/tests/test_frontend_assets.py asserts every local href below resolves.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffd75e" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#161618" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CiteVyn — a cited RAG assistant for Claude, Claude Code, Codex, and Gemini."
    />
    <meta name="color-scheme" content="light dark" />
    <title>CiteVyn — Cited answers for your AI tools</title>

    <!-- Geist is the typeface `--font-sans` / `--font-display` ask for, so it has
         to actually be delivered: without this link the first entry in the stack
         is unavailable and every heading and paragraph silently falls through to
         `system-ui` — SF Pro on macOS, Segoe UI on Windows (#316). Weights are
         requested as a VARIABLE font (`wght@400..700`), which is ONE @font-face
         rule covering the whole range the CSS uses (400/500/600/700 — measured,
         and nothing anywhere needs 800). It is 28.6 KB.

         NOT a byte saving: asking for the four static weights returns four
         @font-face blocks whose `src` is the SAME file, so a browser fetches
         28.6 KB either way. An earlier version of this comment claimed 114.4 KB
         and a "75% saving" — that was the same file counted four times by a
         script that keyed on weight instead of de-duplicating URLs. The variable
         form is still right, for the honest reason: one rule, whole range, no
         weight synthesis.

         CAVEAT worth knowing: `<strong>`/`<b>` default to `font-weight: bolder`,
         which is RELATIVE — inside a 600 or 700 container it resolves to 900, and
         Geist clamps 800/900 to 700, so bold emphasis would render exactly as
         heavy as its parent and visually vanish. Safe today: every prose
         container that produces <strong> (AnswerBody's markdown bold) computes to
         400. Setting a prose container to 600 would break it silently.

         Served from fonts.gstatic.com, already allowed by the CSP font-src, and
         folded into the existing Google Fonts request so it adds no new host,
         preconnect, or round trip. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preconnect"
      href="https://api.fontshare.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Geist:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap"
      rel="stylesheet"
    />

    <!-- Softly theme: Outfit (sans) + Reenie Beanie (cursive). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Reenie+Beanie&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
